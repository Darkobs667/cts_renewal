[www]
listen = 127.0.0.1:9000

; ── Gestion des processus ────────────────────────────────────────────────────
; Mode dynamic : crée des workers à la demande, libère la mémoire en période creuse.
pm = dynamic

; Render free tier : 2 vCPU, 512 MB RAM.
; Chaque worker PHP consomme ~24 MB → 15 workers = ~360 MB, Nginx ~20 MB → safe.
; Formula : (RAM disponible - overhead) / mémoire_par_worker
pm.max_children      = 15
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recycler les workers après 500 requêtes pour prévenir les fuites mémoire.
pm.max_requests = 500

; ── Timeouts & logs ──────────────────────────────────────────────────────────
request_terminate_timeout = 30s
catch_workers_output      = yes
clear_env                 = no

; ── Statut FPM (monitoring interne) ──────────────────────────────────────────
pm.status_path = /fpm-status
ping.path      = /fpm-ping
